version: '3.8'

services:

  # ── PostgreSQL Database ──────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: rentora-db
    environment:
      POSTGRES_DB: rentora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rentora-network
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ──────────────────────────
  backend:
    build:
      context: ./rentora-backend
      dockerfile: Dockerfile
    container_name: rentora-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rentora_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: ${APP_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rentora-network

  # ── React Frontend ───────────────────────────────
  frontend:
    build:
      context: ./rentora-frontend
      dockerfile: Dockerfile
    container_name: rentora-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rentora-network

networks:
  rentora-network:
    driver: bridge

volumes:
  postgres_data: