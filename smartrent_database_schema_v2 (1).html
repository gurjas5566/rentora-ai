
<div style="padding: 1rem 0; font-family: var(--font-sans);">
<div id="erd"></div>
<style>
#erd svg { width: 100% !important; }
#erd .er.relationshipLabel { font-size: 11px !important; }
</style>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#4a4a4a',
    textColor: dark ? '#c2c0b6' : '#1a1a1a',
    primaryColor: dark ? '#1D3A5F' : '#B5D4F4',
    primaryTextColor: dark ? '#e0e0e0' : '#042C53',
    primaryBorderColor: dark ? '#378ADD' : '#185FA5',
    attributeBackgroundColorEven: dark ? '#1a2a3a' : '#E6F1FB',
    attributeBackgroundColorOdd: dark ? '#162030' : '#f0f7ff',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USERS {
    uuid id PK
    string name
    string email
    string password
    string role
    string phone
    boolean is_verified
    timestamp created_at
  }
  OWNER_PROFILES {
    uuid id PK
    uuid user_id FK
    string business_name
    string address
    boolean is_verified
  }
  PROPERTIES {
    uuid id PK
    uuid owner_id FK
    string title
    string city
    string address
    float rent
    float deposit
    int bedrooms
    string furnishing
    string status
    timestamp created_at
  }
  PROPERTY_IMAGES {
    uuid id PK
    uuid property_id FK
    string image_url
    boolean is_primary
  }
  MESSAGES {
    uuid id PK
    uuid tenant_id FK
    uuid owner_id FK
    uuid property_id FK
    string content
    timestamp created_at
  }
  SCHEDULES {
    uuid id PK
    uuid tenant_id FK
    uuid property_id FK
    timestamp visit_date
    string status
  }
  REVIEWS {
    uuid id PK
    uuid tenant_id FK
    uuid property_id FK
    int rating
    string comment
    timestamp created_at
  }
  NOTIFICATIONS {
    uuid id PK
    uuid user_id FK
    string type
    string message
    boolean is_read
    timestamp created_at
  }

  USERS ||--o{ OWNER_PROFILES : "has"
  USERS ||--o{ PROPERTIES : "lists"
  USERS ||--o{ MESSAGES : "sends"
  USERS ||--o{ SCHEDULES : "books"
  USERS ||--o{ REVIEWS : "writes"
  USERS ||--o{ NOTIFICATIONS : "receives"
  PROPERTIES ||--o{ PROPERTY_IMAGES : "has"
  PROPERTIES ||--o{ MESSAGES : "about"
  PROPERTIES ||--o{ SCHEDULES : "for"
  PROPERTIES ||--o{ REVIEWS : "receives"
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
</div>
